<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football-Hub</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <h1>Bem vindo ao Football-hub</h1>

    <div class="barra-de-controles">
      <button onclick="LoadTodaysGames()">Atualizar</button>

      <select class="filtro-de-liga" onchange="filterByLeague()">
        <option value="TODAS">Todas as ligas</option>
        <option value="PL">Premier League</option>
        <option value="PD">La Liga</option>
        <option value="FL1">Ligue 1</option>
        <option value="SA">Serie A</option>
        <option value="BL1">Bundesliga</option>
        <option value="BSA">Brasileirão Série A</option>
      </select>

      <select class="time-favorito" onchange="saveFavoriteTeam()">
        <option value="">Escolher time favorito</option>
      </select>
    </div>

    <p class="mensagem-de-status"></p>
    <section class="lista-de-jogos"></section>
  </body>
  <script src="./js/app.js"></script>
</html>
